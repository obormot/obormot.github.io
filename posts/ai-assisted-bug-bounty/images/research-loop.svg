<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="500" height="560" style="max-width:100%;height:auto;display:block;margin:1.5rem auto">
<defs>
  <marker id="ag" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="6" markerHeight="4.5" orient="auto">
    <path d="M0,0 10,3.5 0,7z" fill="#6ab06a"/>
  </marker>
  <marker id="ab" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="6" markerHeight="4.5" orient="auto">
    <path d="M0,0 10,3.5 0,7z" fill="#7088d0"/>
  </marker>
  <marker id="ao" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="6" markerHeight="4.5" orient="auto">
    <path d="M0,0 10,3.5 0,7z" fill="#d07030"/>
  </marker>
  <marker id="af" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="6" markerHeight="4.5" orient="auto">
    <path d="M0,0 10,3.5 0,7z" fill="#ccc"/>
  </marker>
</defs>

<!-- dashed loop box (spans Human + Claude columns) -->
<rect x="12" y="152" width="476" height="210" rx="8" fill="none" stroke="#ccc" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="110" y="168" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#ccc" text-anchor="middle">HUMAN</text>
<text x="390" y="168" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#ccc" text-anchor="middle">CLAUDE</text>

<!-- J1: Hypothesis (Joint) -->
<rect x="150" y="18" width="200" height="52" rx="6" fill="#f0faf0" stroke="#6ab06a" stroke-width="1.3"/>
<text x="250" y="36" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d6a2d" text-anchor="middle">Hypothesis</text>
<text x="250" y="53" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#5a9a5a" text-anchor="middle">discovery · recognition</text>
<text x="250" y="12" font-family="ui-sans-serif,system-ui,sans-serif" font-size="8.5" font-weight="700" letter-spacing="1" fill="#aaa" text-anchor="middle">JOINT</text>

<!-- C1: Source analysis (Claude, above loop) -->
<rect x="300" y="88" width="180" height="52" rx="6" fill="#eff3ff" stroke="#7088d0" stroke-width="1.3"/>
<text x="390" y="109" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#2a409a" text-anchor="middle">Source analysis</text>
<text x="390" y="126" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#6070b0" text-anchor="middle">call-chain tracing</text>

<!-- H2: Steer (Human, in loop) -->
<rect x="20" y="178" width="180" height="52" rx="6" fill="#fff5ea" stroke="#d07030" stroke-width="1.3"/>
<text x="110" y="199" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#7a3a10" text-anchor="middle">Steer</text>
<text x="110" y="216" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#b06030" text-anchor="middle">validate · expand · redirect</text>

<!-- C2: PoC · validation (Claude, in loop) -->
<rect x="300" y="178" width="180" height="52" rx="6" fill="#eff3ff" stroke="#7088d0" stroke-width="1.3"/>
<text x="390" y="199" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#2a409a" text-anchor="middle">PoC development</text>
<text x="390" y="216" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#6070b0" text-anchor="middle">live validation</text>

<!-- H3: Impact assessment (Human, in loop) -->
<rect x="20" y="288" width="180" height="52" rx="6" fill="#fff5ea" stroke="#d07030" stroke-width="1.3"/>
<text x="110" y="309" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#7a3a10" text-anchor="middle">Impact assessment</text>
<text x="110" y="326" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#b06030" text-anchor="middle">scope · context</text>

<!-- C3: Boundary analysis (Claude, in loop) -->
<rect x="300" y="288" width="180" height="52" rx="6" fill="#eff3ff" stroke="#7088d0" stroke-width="1.3"/>
<text x="390" y="309" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#2a409a" text-anchor="middle">Boundary analysis</text>
<text x="390" y="326" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#6070b0" text-anchor="middle">dead-end paths</text>

<!-- C4: Structured report (Claude, below loop) -->
<rect x="300" y="388" width="180" height="52" rx="6" fill="#eff3ff" stroke="#7088d0" stroke-width="1.3"/>
<text x="390" y="414" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#2a409a" text-anchor="middle">Structured report</text>

<!-- H4: Responsible disclosure (Human, below loop) -->
<rect x="20" y="460" width="180" height="52" rx="6" fill="#fff5ea" stroke="#d07030" stroke-width="1.3"/>
<text x="110" y="486" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#7a3a10" text-anchor="middle">Responsible disclosure</text>

<!-- ARROWS -->

<!-- J1 → C1 (green) -->
<line x1="348" y1="70" x2="374" y2="88" stroke="#6ab06a" stroke-width="1.5" marker-end="url(#ag)"/>

<!-- C1 → H2 (blue, diagonal) -->
<line x1="302" y1="114" x2="202" y2="178" stroke="#7088d0" stroke-width="1.5" marker-end="url(#ab)"/>

<!-- H2 → C2 (orange, horizontal) -->
<line x1="200" y1="204" x2="300" y2="204" stroke="#d07030" stroke-width="1.5" marker-end="url(#ao)"/>

<!-- C2 → H3 (blue, dog-leg via y=256) -->
<polyline points="390,230 390,256 110,256 110,288" fill="none" stroke="#7088d0" stroke-width="1.5" marker-end="url(#ab)"/>

<!-- H2 → C3 (orange, exits right then routes down and right) -->
<polyline points="200,216 252,216 252,300 300,300" fill="none" stroke="#d07030" stroke-width="1.5" marker-end="url(#ao)"/>

<!-- H3 → H2 feedback (grey dashed, left side) -->
<polyline points="20,314 2,314 2,204 20,204" fill="none" stroke="#ccc" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#af)"/>

<!-- C3 → C2 feedback (grey dashed, right side) -->
<polyline points="480,314 498,314 498,204 480,204" fill="none" stroke="#ccc" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#af)"/>

<!-- H3 → C4 (orange, through center) -->
<polyline points="200,314 252,314 252,414 300,414" fill="none" stroke="#d07030" stroke-width="1.5" marker-end="url(#ao)"/>

<!-- C4 → H4 (blue, down then left) -->
<polyline points="390,440 390,486 200,486" fill="none" stroke="#7088d0" stroke-width="1.5" marker-end="url(#ab)"/>

</svg>
